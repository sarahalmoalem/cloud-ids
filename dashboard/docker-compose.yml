services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ids
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ids
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana-oss
    ports:
      - "3000:3000"
    volumes:
      - grafdata:/var/lib/grafana

volumes:
  dbdata:
  grafdata: